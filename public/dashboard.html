<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

    <main class="auth-card dashboard">

        <div class="flower">✿</div>

        <h1>My Task Manager</h1>

        <p class="subtitle">
            A little progress every day ♡
        </p>

        <button id="logoutButton" type="button" class="logout-btn">
            Log out
        </button>

        <!-- TASK FORM -->
        <form id="taskForm">

            <label for="taskTitle">
                Add a new task
            </label>

            <input
                id="taskTitle"
                maxlength="120"
                required
                placeholder="What would you like to do?"
            >

            <label for="priority">Priority</label>

            <select id="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

            <label for="dueDate">Due Date</label>

            <input type="date" id="dueDate">

            <button type="submit">
                Add Task ♡
            </button>

        </form>

        <p id="taskMessage" role="status"></p>

        <!-- SEARCH AND FILTERS -->
        <section class="task-controls">

            <input
                type="text"
                id="searchTask"
                placeholder="Search tasks..."
            >

            <select id="statusFilter">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>

            <select id="priorityFilter">
                <option value="">All Priorities</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

        </section>

        <!-- EXISTING STATISTICS -->
        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>

        <!-- ANALYTICS -->
        <section class="analytics-section">

            <h2>Task Analytics</h2>

            <p class="analytics-subtitle">
                Track your productivity and progress ♡
            </p>

            <div class="analytics-grid">

                <div class="analytics-card total-card">
                    <span>Total Tasks</span>
                    <h3 id="analyticsTotal">0</h3>
                </div>

                <div class="analytics-card completed-card">
                    <span>Completed</span>
                    <h3 id="analyticsCompleted">0</h3>
                </div>

                <div class="analytics-card pending-card">
                    <span>Pending</span>
                    <h3 id="analyticsPending">0</h3>
                </div>

                <div class="analytics-card overdue-card">
                    <span>Overdue</span>
                    <h3 id="analyticsOverdue">0</h3>
                </div>

            </div>

            <!-- PROGRESS -->
            <div class="analytics-progress-card">

                <h3>Overall Progress</h3>

                <div class="progress-track">
                    <div
                        id="analyticsProgressBar"
                        class="progress-fill"
                    ></div>
                </div>

                <p id="analyticsPercentage">
                    0% Completed
                </p>

            </div>

            <!-- PRIORITY ANALYTICS -->
            <div class="priority-analytics-card">

                <h3>Priority Overview</h3>

                <div class="priority-row">
                    <span>High</span>
                    <span id="analyticsHigh">0</span>
                </div>

                <div class="priority-row">
                    <span>Medium</span>
                    <span id="analyticsMedium">0</span>
                </div>

                <div class="priority-row">
                    <span>Low</span>
                    <span id="analyticsLow">0</span>
                </div>

            </div>

        </section>

        <!-- TASK LIST -->
        <ul id="taskList"></ul>

        <a href="/">Back to Portfolio</a>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/tasks.js"></script>
    <script src="js/analytics.js"></script>

</body>
</html>
